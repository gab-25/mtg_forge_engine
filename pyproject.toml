[project]
name = "forge-bridge"
version = "0.1.0"
description = "HTTP bridge exposing the Forge MTG rules engine to external agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "JPype1>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["jvm: needs the Forge JVM (runs in the Docker image)"]
