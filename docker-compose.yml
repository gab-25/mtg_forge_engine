services:
  mtg-forge-engine:
    build: .
    image: mtg-forge-engine
    environment:
      MAX_CONCURRENT_GAMES: ${MAX_CONCURRENT_GAMES:-16}
      DECISION_TIMEOUT: ${DECISION_TIMEOUT:-120}
      MAX_TURNS: ${MAX_TURNS:-50}
      GAME_TTL: ${GAME_TTL:-3600}
      ORPHAN_TIMEOUT: ${ORPHAN_TIMEOUT:-600}
      # Simulated outcomes on attack, block and priority decisions (README): off until the client reads them.
      SIMULATE: ${SIMULATE:-0}
      MAX_CANDIDATES: ${MAX_CANDIDATES:-8}
      MAX_TARGETS_PER_ABILITY: ${MAX_TARGETS_PER_ABILITY:-4}
      SIMULATION_BUDGET_MS: ${SIMULATION_BUDGET_MS:-1500}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx2g}
    ports:
      # No authentication: published on localhost only.
      - "127.0.0.1:8080:8080"
